<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수시 상담 보드 · 나주고 3학년실</title>
<link rel="stylesheet" href="board/style.css">
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <div>
      <h1>수시 상담 보드</h1>
      <p class="sub" id="who">연결 준비 중</p>
    </div>
    <div class="bar-tools">
      <span class="chip" id="conn">대기</span>
      <button class="btn" id="stage" type="button">단계</button>
      <button class="btn" id="reload" type="button">새로고침</button>
      <button class="btn" id="toggle-setup" type="button">설정</button>
    </div>
  </div>
</header>

<main class="wrap">

  <section class="panel setup" id="setup" hidden>
    <div>
      <label for="api-url">Apps Script 주소</label>
      <p class="hint">즐겨찾기 시트에서 배포한 웹 앱 주소(<span class="nowrap">…/exec</span>)를 넣습니다.
        이 주소는 이 브라우저에만 저장되고 다른 곳으로 보내지지 않습니다.</p>
    </div>
    <input id="api-url" type="url" inputmode="url" autocomplete="off"
           placeholder="https://script.google.com/macros/s/…/exec">
    <div>
      <button class="btn btn-primary" id="save-url" type="button">저장하고 연결</button>
      <button class="btn" id="try-demo" type="button">보기용 자료로 열기</button>
    </div>
    <p class="hint">보기용 자료는 지어낸 이름으로 화면만 확인하는 용도입니다.</p>
  </section>

  <div class="layout">
    <aside class="panel">
      <div class="panel-head">
        <h2>학생</h2>
        <span class="count" id="roster-count"></span>
      </div>
      <div class="tabs" id="tabs"></div>
      <p class="scope" id="scope"></p>
      <ul class="roster" id="roster"></ul>
    </aside>

    <div>
      <div class="tabs views">
        <button class="btn" id="view-board" type="button" aria-pressed="true">보드</button>
        <button class="btn" id="view-schedule" type="button" aria-pressed="false">일정</button>
        <button class="btn" id="view-links" type="button" aria-pressed="false">학생 링크</button>
        <button class="btn" id="view-verify" type="button" aria-pressed="false">점검</button>
        <button class="btn" id="view-export" type="button" aria-pressed="false">내보내기</button>
      </div>
      <div id="board"></div>
      <div id="schedule" hidden></div>
      <div id="links" hidden></div>
      <div id="verify" hidden></div>
      <div id="export" hidden></div>
    </div>
  </div>
</main>

<!-- 상세는 본문 밖에 둔다. 보드를 다시 그려도 열어 둔 상세가 닫히지 않게 하기 위해서다. -->
<div class="overlay" id="detail" hidden></div>

<script type="module">
import * as api from './board/api.js';
import * as store from './board/store.js';
import { start } from './board/board.js';
import { start as startSchedule } from './board/schedule.js';
import { start as startLinks } from './board/links.js';
import { start as startVerify } from './board/verify.js';
import { start as startExport } from './board/export.js';

// iOS 사파리는 터치 리스너가 없으면 :active 가 발화하지 않는다
document.addEventListener('touchstart', () => {}, { passive: true });

// 덮개의 빈 곳을 누르면 상세를 닫는다. 안쪽(카드)에서 시작된 누름은 그대로 둔다.
document.getElementById('detail').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) store.select({ appId: '' });
});

const conn = document.getElementById('conn');
const who = document.getElementById('who');
const setup = document.getElementById('setup');
const input = document.getElementById('api-url');

function setConn(text, kind) {
  conn.textContent = text;
  conn.className = `chip${kind ? ' ' + kind : ''}`;
}

function showSetup(on) {
  setup.hidden = !on;
  if (on) input.focus();
}

document.getElementById('toggle-setup').onclick = () => showSetup(setup.hidden);

document.getElementById('save-url').onclick = async () => {
  api.configure(input.value);
  showSetup(false);
  await connect();
};

document.getElementById('try-demo').onclick = async () => {
  const { demo } = await import('./board/demo.js');
  store.loadLocal(demo);
  setConn('보기용 자료', 'on');
  who.textContent = '지어낸 이름으로 화면만 보여 주는 중입니다';
  showSetup(false);
};

document.getElementById('reload').onclick = () => connect();

async function connect() {
  if (!api.configured()) {
    setConn('설정 필요', 'off');
    who.textContent = 'Apps Script 주소를 넣으면 우리 반 지원 현황이 나옵니다.';
    showSetup(true);
    return;
  }
  setConn('불러오는 중');
  try {
    await store.load();
    setConn('연결됨', 'on');
    who.textContent = store.state.who ? `${store.state.who} 로 연결` : '연결됨';
  } catch (err) {
    setConn('연결 실패', 'off');
    who.textContent = `오류: ${err.message}`;
  }
}

// 화면 셋은 같은 선택(반·학생)을 보고 서로 다른 칸에 그린다
const VIEWS = ['board', 'schedule', 'links', 'verify', 'export'];
const panes = Object.fromEntries(VIEWS.map((v) => [v, document.getElementById(v)]));
function showView(name) {
  for (const v of VIEWS) {
    panes[v].hidden = v !== name;
    document.getElementById(`view-${v}`).setAttribute('aria-pressed', String(v === name));
  }
  store.select({});           // 지금 화면을 다시 그리게 한다
}
for (const v of VIEWS) document.getElementById(`view-${v}`).onclick = () => showView(v);

/* 단계 — 지원을 고민하는 때와 지원이 확정된 뒤는 보는 것이 다르다.
   학교 컴퓨터를 여럿이 쓰므로 이 컴퓨터의 설정으로 기억해 둔다. */
const STAGE_KEY = 'board.stage';
let stage = 'plan';
try { stage = localStorage.getItem(STAGE_KEY) || 'plan'; } catch (err) { stage = 'plan'; }

function applyStage(next, jump) {
  stage = next;
  try { localStorage.setItem(STAGE_KEY, stage); } catch (err) { /* 저장이 막혀도 이번엔 쓴다 */ }
  document.body.dataset.stage = stage;
  document.getElementById('stage').textContent =
    stage === 'plan' ? '단계 · 지원 고민' : '단계 · 지원 확정';
  if (jump) showView(stage === 'plan' ? 'board' : 'schedule');
}
document.getElementById('stage').onclick = () => applyStage(stage === 'plan' ? 'fixed' : 'plan', true);

start();
startSchedule();
startLinks();
startVerify();
startExport();
applyStage(stage, true);
input.value = api.url();
if (new URLSearchParams(location.search).has('demo')) {
  document.getElementById('try-demo').click();
} else {
  connect();
}
</script>

</body>
</html>
