<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내신 중심 진학상담 보드</title>
<style>
:root{
  --bg:#f4f6fa;--card:#ffffff;--line:#e3e8f0;--text:#1e2a3a;--mut:#64748b;--mut2:#94a3b8;
  --pri:#1e3a5f;--acc:#2563eb;--gold:#b45309;
  --safe:#15803d;--fit:#0369a1;--reach:#b45309;--high:#be123c;
  --shadow:0 1px 3px rgba(30,42,58,.08),0 4px 14px rgba(30,42,58,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}
header{position:sticky;top:0;z-index:50;background:var(--pri);color:#fff;padding:0 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:var(--shadow)}
header h1{font-size:15px;font-weight:800;padding:11px 4px;letter-spacing:-.3px}
.tabbtn{background:transparent;border:none;color:#cbd5e1;font-size:13.5px;font-weight:700;padding:13px 12px;border-bottom:3px solid transparent}
.tabbtn.on{color:#fff;border-bottom-color:#fbbf24}
.hright{margin-left:auto;display:flex;gap:6px;align-items:center;padding:8px 0}
.chip{font-size:11px;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.12);color:#e2e8f0;font-weight:600}
.chip.ok{background:#14532d;color:#bbf7d0}.chip.bad{background:#7f1d1d;color:#fecaca}
.iconbtn{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
main{max-width:1180px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:14px}
.card h2{font-size:14px;font-weight:800;color:var(--pri);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.card h2 .sub{font-size:11px;color:var(--mut);font-weight:500}
.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:300px}
.info-i{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#e0e7ff;color:#4338ca;font-size:10px;font-weight:800;cursor:pointer;border:none;vertical-align:2px}
table.grid{border-collapse:collapse;width:100%;font-size:12.5px}
table.grid th{background:#eef2f8;color:#334155;font-weight:700;padding:6px 8px;border:1px solid var(--line);white-space:nowrap}
table.grid td{padding:6px 8px;border:1px solid var(--line);text-align:center;white-space:nowrap}
.gcell{font-weight:700;border-radius:6px;padding:2px 0}
.badge{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap}
.b-safe{background:#dcfce7;color:var(--safe)}.b-fit{background:#e0f2fe;color:var(--fit)}
.b-reach{background:#fef3c7;color:var(--reach)}.b-high{background:#ffe4e6;color:var(--high)}
.b-gray{background:#f1f5f9;color:var(--mut)}.b-warn{background:#fef9c3;color:#a16207}
.b-up{background:#dcfce7;color:#15803d}.b-dn{background:#ffe4e6;color:#be123c}.b-flat{background:#f1f5f9;color:#475569}
.stulist{display:flex;flex-wrap:wrap;gap:6px}
.stubtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:600}
.stubtn.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.banchips,.searchwrap{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.banchip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 13px;font-size:12px;font-weight:700;color:var(--mut)}
.banchip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input.search{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;outline:none}
input.search:focus{border-color:var(--acc)}
.results{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto}
.resitem{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13px}
.resitem:hover{background:#eef2f8}
.muted{color:var(--mut);font-size:12px}
.small{font-size:11.5px;color:var(--mut)}
.statline{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:12px}
.stat b{font-size:14px;color:var(--pri)}
.svgwrap{overflow-x:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin-top:4px}
.legend .sw{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:3px;margin-right:4px}
.major-card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px;background:#fff}
.major-card h3{font-size:13.5px;color:var(--pri);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.minrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;margin:6px 0}
.minrow .yr{background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.minrow .yr b{color:var(--pri)}
.monthchips{display:flex;gap:4px;flex-wrap:wrap}
.mchip{font-size:11px;padding:2px 8px;border-radius:8px;font-weight:700}
.mchip.y{background:#dcfce7;color:#15803d}.mchip.n{background:#ffe4e6;color:#be123c}.mchip.u{background:#f1f5f9;color:#94a3b8}
.portfolio{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.pcol{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px}
.pcol h4{font-size:12.5px;margin-bottom:8px}
.pitem{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:12.5px;cursor:pointer}
.pitem:hover{border-color:var(--acc)}
.memo-hist{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin:8px 0}
.memo-item{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:7px 10px;font-size:12.5px}
.memo-item .ts{font-size:10.5px;color:#a16207}
textarea.memo{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:64px;resize:vertical;outline:none}
.btn{border:none;border-radius:9px;padding:8px 16px;font-size:12.5px;font-weight:700}
.btn-pri{background:var(--pri);color:#fff}.btn-sub{background:#e2e8f0;color:#334155}.btn-danger{background:#fee2e2;color:#b91c1c}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;padding:22px 24px;position:relative}
.modal h2{font-size:16px;color:var(--pri);margin-bottom:12px}
.modal .x{position:absolute;top:12px;right:14px;border:none;background:#f1f5f9;border-radius:8px;width:30px;height:30px;font-size:15px}
.guide h3{font-size:14px;color:var(--pri);margin:18px 0 6px;padding-top:14px;border-top:1px dashed var(--line)}
.guide h3:first-of-type{border-top:none;padding-top:0;margin-top:6px}
.guide p,.guide li{font-size:13px;line-height:1.7;color:#334155}
.guide ul{padding-left:18px;margin:4px 0}
.guide .formula{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font-size:12.5px;margin:6px 0;font-family:ui-monospace,monospace}
.guide .ev{background:#eff6ff;border-left:3px solid var(--acc);padding:7px 12px;font-size:12.5px;margin:6px 0;border-radius:0 8px 8px 0}
.guide .warn{background:#fff7ed;border-left:3px solid #ea580c;padding:7px 12px;font-size:12.5px;margin:6px 0;border-radius:0 8px 8px 0}
.setrow{margin-bottom:12px}
.setrow label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;color:#334155}
.setrow input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:10px 22px;border-radius:99px;font-size:13px;transition:transform .25s;z-index:200}
#toast.on{transform:translateX(-50%) translateY(0)}
.loading{padding:30px;text-align:center;color:var(--mut)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #cbd5e1;border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:720px){ main{padding:10px 8px 60px} .card{padding:11px 12px} header h1{font-size:13px} .tabbtn{padding:12px 8px;font-size:12.5px} }
</style>
</head>
<body>
<header>
  <h1>🎓 내신 중심 진학상담</h1>
  <button class="tabbtn on" data-tab="student" onclick="switchTab('student')">👥 학생</button>
  <button class="tabbtn" data-tab="major" onclick="switchTab('major')">🏫 학과</button>
  <div class="hright">
    <span class="chip" id="connChip">미연결</span>
    <button class="iconbtn" onclick="reloadLive()" title="학생·상담 데이터 새로고침">🔄</button>
    <button class="iconbtn" onclick="openGuide()" title="분석 기법 안내">📖 분석 안내</button>
    <button class="iconbtn" onclick="openSettings()">⚙️</button>
  </div>
</header>
<main>
  <!-- ===== 학생 탭 ===== -->
  <section id="view-student">
    <div class="card">
      <h2>학생 선택</h2>
      <div class="banchips" id="banChips"></div>
      <div class="stulist" id="stuList"><div class="loading">⚙️ 설정에서 Apps Script URL을 연결하세요 (데모 데이터로 미리보기 중)</div></div>
    </div>
    <div id="stuDetail"></div>
  </section>
  <!-- ===== 학과 탭 ===== -->
  <section id="view-major" hidden>
    <div class="card">
      <h2>대학·학과 검색 <span class="sub" id="ipStatus"></span></h2>
      <div class="searchwrap">
        <select id="regionSel" onchange="renderMajorSearch()" style="border:1px solid var(--line);border-radius:10px;padding:8px"></select>
        <input class="search" id="majorSearch" placeholder="대학명 · 학과명 검색 (예: 전남대 간호)" oninput="renderMajorSearch()">
      </div>
      <div class="results" id="majorResults"></div>
    </div>
    <div id="majorDetail"></div>
  </section>
</main>
<div class="modal-bg" id="modalGuide"><div class="modal"><button class="x" onclick="closeModal('modalGuide')">✕</button><h2>📖 분석 기법 안내</h2><div class="guide" id="guideBody"></div></div></div>
<div class="modal-bg" id="modalSettings"><div class="modal" style="max-width:560px"><button class="x" onclick="closeModal('modalSettings')">✕</button><h2>⚙️ 설정</h2>
  <div class="setrow"><label>Apps Script 웹앱 URL</label><input id="cfgUrl" placeholder="https://script.google.com/macros/s/AKfy.../exec"></div>
  <div class="setrow"><label>현재 학년 (학번 앞자리)</label><input id="cfgGrade" value="3" style="width:80px"></div>
  <div style="display:flex;gap:8px"><button class="btn btn-pri" onclick="saveSettings()">저장 후 연결</button><button class="btn btn-sub" onclick="closeModal('modalSettings')">닫기</button></div>
  <p class="small" style="margin-top:12px">데이터는 선생님 구글시트에만 저장됩니다. 이 파일에는 학생 정보가 내장되지 않습니다.<br>시트 구성: <b>학과입결 · 최저타깃 · 내신1반~내신6반 · 모고 · 상담</b> (설치가이드 참조)</p>
</div></div>
<div id="toast"></div>
<script>
/* ================================================================
   설정 · 통신
================================================================ */
const CFG_KEY='counsel_cfg_v1';
let CFG={url:'',grade:'3'};
try{const s=JSON.parse(localStorage.getItem(CFG_KEY)||'null'); if(s)Object.assign(CFG,s);}catch(e){}
function openSettings(){document.getElementById('cfgUrl').value=CFG.url;document.getElementById('cfgGrade').value=CFG.grade;document.getElementById('modalSettings').classList.add('on');}
function saveSettings(){CFG.url=document.getElementById('cfgUrl').value.trim();CFG.grade=document.getElementById('cfgGrade').value.trim()||'3';localStorage.setItem(CFG_KEY,JSON.stringify(CFG));closeModal('modalSettings');initLoad();}
function closeModal(id){document.getElementById(id).classList.remove('on');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),2200);}
function jsonp(url){return new Promise((res,rej)=>{
  const cb='__jp'+Date.now()+Math.floor(Math.random()*1e5);
  const sc=document.createElement('script');
  const timer=setTimeout(()=>{clean();rej(new Error('응답 시간 초과'));},120000);
  function clean(){clearTimeout(timer);delete window[cb];sc.remove();}
  window[cb]=d=>{clean();res(d);};
  sc.onerror=()=>{clean();rej(new Error('네트워크 오류'));};
  sc.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
  document.body.appendChild(sc);});}

/* ================================================================
   전역 상태
================================================================ */
let DATA={ip:[],ipCols:{},minT:[],students:{},counsel:[],mock:{}};
let UI={tab:'student',curStu:null,curMajor:null,demo:true};
const MONTH_ORDER=['3월','4월','5월','6월','7월','8월','9월','10월','11월'];
const SEM_ORDER=['1-1','1-2','2-1','2-2','3-1'];

/* ================================================================
   NEIS 내신 파서  (반별 시트: 내신1반~내신6반)
   열: 번호|성명|학년|학기|교과|과목|학점수|원점수/평균(표준편차)|성취도(수강자수)|석차등급|비고
================================================================ */
const SUBJ_GROUP=[
 [/^(국어|독서|문학|화법과\s*작문|언어와\s*매체|독서와\s*문법|화법과\s*언어|주제\s*탐구\s*독서|문학과\s*영상)/,'K'],
 [/^(수학|미적분|확률과\s*통계|기하|대수|경제\s*수학|인공지능\s*수학|미적분학)/,'M'],
 [/^(영어|심화\s*영어)/,'E'],
 [/^(통합사회|한국지리|세계지리|생활과\s*윤리|윤리와\s*사상|정치와\s*법|경제(?!\s*수학)|사회·?문화|사회문화|세계사|동아시아사|여행지리|사회문제\s*탐구|통합과학|물리학?|화학|생명과학|지구과학|융합과학|과학탐구실험)/,'T'],
 [/^한국사/,'H'],
];
function classifySubject(name){
  name=(name||'').trim();
  for(const [re,g] of SUBJ_GROUP){if(re.test(name))return g;}
  return 'X';
}
function fnum(v){const n=parseFloat(String(v??'').replace(/[^\d.\-]/g,''));return isNaN(n)?null:n;}
function parseNeisSheet(values,ban){
  // values: 2차원 배열. 상태기계: 성명/번호/학년/학기 이월
  const out={}; // no -> student
  let st={no:null,name:null,yr:null,sem:null};
  for(const row of values){
    const c=i=>String(row[i]??'').trim();
    const A=c(0),B=c(1),C=c(2),D=c(3),E=c(4),F=c(5),G=c(6),H=c(7),I=c(8),J=c(9),K=c(10);
    if(/성\s*명/.test(B)||/번\s*호/.test(A))continue;            // 헤더
    if(B&&!/^\d/.test(B)){ st.name=B; const a=fnum(A); if(a!=null&&a>=1&&a<=40)st.no=Math.round(a);
      const yy=fnum(C),ss=fnum(D); if(yy>=1&&yy<=3)st.yr=Math.round(yy); if(ss>=1&&ss<=2)st.sem=Math.round(ss); }
    else{
      const a=fnum(A),dd=fnum(D);
      if(a!=null&&a>=1&&a<=3&&dd!=null&&dd>=1&&dd<=2&&F){st.yr=Math.round(a);st.sem=Math.round(dd);}
      else if(a!=null&&a>=1&&a<=2&&!D&&F&&a===((st.sem||0)+1)){st.sem=Math.round(a);}
      const yy=fnum(C),ss=fnum(D);
      if(yy!=null&&yy>=1&&yy<=3)st.yr=Math.round(yy);
      if(ss!=null&&ss>=1&&ss<=2&&F)st.sem=Math.round(ss);
    }
    if(!F||!st.name||!st.no||!st.yr||!st.sem)continue;            // 과목행 아님
    const credit=fnum(G); if(credit==null)continue;
    const grade=fnum(J);                                          // 석차등급(P/공란→null)
    const achM=I.match(/^([A-E])/); const ach=achM?achM[1]:null;
    const key=st.no;
    const stu=out[key]||(out[key]={ban,no:st.no,name:st.name,sems:{}});
    const semKey=st.yr+'-'+st.sem;
    const sem=stu.sems[semKey]||(stu.sems[semKey]={subjects:[]});
    sem.subjects.push({name:F,credit,grade:(grade!=null&&grade>=1&&grade<=9)?grade:null,ach,group:classifySubject(F)});
  }
  // 학기별 집계
  Object.values(out).forEach(stu=>{
    Object.entries(stu.sems).forEach(([sk,sem])=>{
      const g=sem.subjects.filter(s=>s.grade!=null);
      const w=(arr)=>{const cs=arr.reduce((a,s)=>a+s.credit,0);return cs?arr.reduce((a,s)=>a+s.grade*s.credit,0)/cs:null;};
      sem.all=w(g);
      const km=g.filter(s=>'KMET'.includes(s.group));
      sem.kmet=w(km);
      sem.kor=w(g.filter(s=>s.group==='K')); sem.math=w(g.filter(s=>s.group==='M')); sem.eng=w(g.filter(s=>s.group==='E'));
      const tg=g.filter(s=>s.group==='T'); sem.tan=tg.length?Math.min(...tg.map(s=>s.grade)):null;
      sem.career=sem.subjects.filter(s=>s.grade==null&&s.ach).map(s=>s.name+':'+s.ach);
      sem.creditsG=g.reduce((a,s)=>a+s.credit,0);
    });
    // 누적(학점가중)
    const allS=Object.values(stu.sems).flatMap(s=>s.subjects.filter(x=>x.grade!=null));
    const cw=(arr)=>{const cs=arr.reduce((a,s)=>a+s.credit,0);return cs?arr.reduce((a,s)=>a+s.grade*s.credit,0)/cs:null;};
    stu.cum={all:cw(allS),kmet:cw(allS.filter(s=>'KMET'.includes(s.group))),
      kor:cw(allS.filter(s=>s.group==='K')),math:cw(allS.filter(s=>s.group==='M')),eng:cw(allS.filter(s=>s.group==='E'))};
    const tans=Object.values(stu.sems).map(s=>s.tan).filter(v=>v!=null);
    stu.cum.tan=tans.length?tans.reduce((a,b)=>a+b,0)/tans.length:null;
  });
  return out;
}

/* ================================================================
   모고 파서 (기존 트래커 시트 '전체' 레이아웃 — 학번 앵커)
================================================================ */
function parseMockSheet(values){
  const rows=values.map(r=>r.map(c=>String(c??'').trim()));
  const tally={};
  for(const r of rows)for(let i=0;i<r.length;i++){if(/^\d{4}$/.test(r[i]))tally[i]=(tally[i]||0)+1;}
  let hk=-1,bn=0;for(const k in tally)if(tally[k]>bn){bn=tally[k];hk=+k;}
  if(hk<3)hk=3;
  const O={no:hk-3,name:hk-2,month:hk-1,korSub:hk+1,korG:hk+3,mathSub:hk+4,mathG:hk+6,engG:hk+8,t1Sub:hk+9,t1G:hk+11,t2Sub:hk+12,t2G:hk+14,histG:hk+16};
  const gi=v=>{v=(v||'').trim();return /^\d+$/.test(v)?parseInt(v):null;};
  const map={};let curName=null;
  for(const r of rows){
    const c=i=>(i>=0&&r[i]!=null?r[i]:'');
    if(c(O.name))curName=c(O.name);
    const hak=c(hk);if(!/^\d{4}$/.test(hak))continue;

      mathSub:c(O.mathSub),t1Sub:c(O.t1Sub),t2Sub:c(O.t2Sub)};

    const s=map[hak]||(map[hak]={hak,ban:+hak[1],no:+hak.slice(2),name:curName,months:{}});

/* ================================================================
   통계 도우미  ⓘ 분석 안내 참조
================================================================ */
function theilSen(pts){ // pts:[{x,y}] → 중앙값 기울기 (소표본·이상치 강건)
  const sl=[];
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    if(pts[j].x!==pts[i].x)sl.push((pts[j].y-pts[i].y)/(pts[j].x-pts[i].x));}
  if(!sl.length)return null;
  sl.sort((a,b)=>a-b);return sl[Math.floor(sl.length/2)];
}
function erf(x){const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x);
  return s*y;}
function phi(z){return 0.5*(1+erf(z/Math.SQRT2));}
const GLOBAL_SPREAD_SIGMA=0.38;        // 등급70−등급50 중앙값 0.20 / 0.524 (n=47,128 검증)
const REBOUND_COEF=-0.38;              // 격년효과 회귀계수 (corr −0.38, n=12,995 검증)
function predictCut(series){ // series:[{year,cut70,cut50}] 정렬됨 → 예측·변동성
  const pts=series.filter(s=>s.cut70!=null);
  if(pts.length<2)return null;
  const w=pts.map((p,i)=>1+0.45*i);                       // 최근 가중
  const wsum=w.reduce((a,b)=>a+b,0);
  let center=pts.reduce((a,p,i)=>a+p.cut70*w[i],0)/wsum;
  const mean=pts.reduce((a,p)=>a+p.cut70,0)/pts.length;
  const sigma=Math.sqrt(pts.reduce((a,p)=>a+(p.cut70-mean)**2,0)/pts.length);
  let rebound=null;
  if(pts.length>=2){
    const d=pts[pts.length-1].cut70-pts[pts.length-2].cut70;
    if(Math.abs(d)>=0.5){const adj=REBOUND_COEF*d;center+=adj;rebound={lastDelta:d,adj};}
  }
  const band=Math.max(sigma,0.2);
  const vola=sigma<0.15?'낮음':(sigma<=0.40?'보통':'높음');
  return {center,lo:center-band,hi:center+band,sigma,vola,rebound,n:pts.length};
}
function percentileEst(series,grade){ // 합격자 분포 내 위치 (50/70컷 2분위 → μ,σ)
  const recent=series.filter(s=>s.cut70!=null).slice(-2);
  if(!recent.length||grade==null)return null;
  const cut70=recent.reduce((a,s)=>a+s.cut70,0)/recent.length;
  const r50=recent.filter(s=>s.cut50!=null);
  let mu,sd;
  if(r50.length){const cut50=r50.reduce((a,s)=>a+s.cut50,0)/r50.length;
    mu=cut50;sd=Math.max((cut70-cut50)/0.524,0.18);}
  else{sd=GLOBAL_SPREAD_SIGMA;mu=cut70-0.524*sd;}
  return {pct:phi((grade-mu)/sd)*100,mu,sd};
}
function judgeBadge(pct,vola){
  if(pct==null)return {cls:'b-gray',label:'판정불가'};
  let r;
  if(pct<40)r={cls:'b-safe',label:'안정'};
  else if(pct<75)r={cls:'b-fit',label:'적정'};
  else if(pct<92)r={cls:'b-reach',label:'소신'};
  else r={cls:'b-high',label:'상향'};
  if(vola==='높음')r.label+='·변동큼';
  return r;
}

/* ================================================================
   수능최저 판정 (자유 텍스트 → 자동 판정, 불가 시 텍스트만 표시)
================================================================ */
function checkMinReq(text,sc){ // sc={kor,math,eng,t1,t2,hist,t1Sub,t2Sub} → 'pass'|'fail'|'unknown'|'none'
  text=String(text||'').trim();
  if(!text)return 'unknown';
  if(/없음|미적용|해당\s*없/.test(text))return 'none';
  const segs=text.split(/또는/);
  let any=false,allUnknown=true;
  for(const seg of segs){
    const r=checkOneSeg(seg,sc);
    if(r==='pass'){any=true;allUnknown=false;}
    else if(r==='fail')allUnknown=false;
  }
  if(any)return 'pass';
  return allUnknown?'unknown':'fail';
}
function checkOneSeg(seg,sc){
  const nh=seg.match(/(\d)\s*개?\s*(?:영역\s*)?(?:등급)?\s*합\s*(\d+)/)||seg.match(/(\d)\s*합\s*(\d+)/);
  const hm=seg.match(/한국사\s*(\d)/)||seg.match(/[,·\s]한\s*(\d)/);
  if(hm&&sc.hist!=null&&sc.hist>+hm[1])return 'fail';
  if(!nh)return 'unknown';
  const N=+nh[1],M=+nh[2];
  const sciOnly=/과학\s*탐구|과탐/.test(seg)&&!/사회\s*탐구|사탐/.test(seg);
  const socOnly=/사회\s*탐구|사탐/.test(seg)&&!/과학\s*탐구|과탐/.test(seg);
  const avg2=/2\s*과목\s*평균|탐\s*\(?2|탐구\s*2/.test(seg);
  const tclass=s=>!s?'unk':(/물리|화학|생명|지구|과학/.test(s)?'sci':'soc');
  let tans=[];
  if(sc.t1!=null)tans.push({g:sc.t1,c:tclass(sc.t1Sub)});
  if(sc.t2!=null)tans.push({g:sc.t2,c:tclass(sc.t2Sub)});
  if(sciOnly)tans=tans.filter(t=>t.c!=='soc');
  if(socOnly)tans=tans.filter(t=>t.c!=='sci');
  const tg=tans.map(t=>t.g).sort((a,b)=>a-b);
  let tanVal=null;
  if(tg.length){tanVal=avg2?(tg.length===2?(tg[0]+tg[1])/2:tg[0]):tg[0];}
  let eng=sc.eng;
  if(/영\s*2\s*등급?은?\s*1/.test(seg)&&eng===2)eng=1;
  const has={국:/국/.test(seg),수:/수/.test(seg),영:/영/.test(seg),탐:/탐|과\s*\(|사\s*\(/.test(seg)};
  const useAll=Object.values(has).filter(Boolean).length<N; // 영역 나열 생략 문구 → 전 영역 후보
  const areas=[];
  if((has.국||useAll)&&sc.kor!=null)areas.push({k:'국',v:sc.kor});
  if((has.수||useAll)&&sc.math!=null)areas.push({k:'수',v:sc.math});
  if((has.영||useAll)&&eng!=null)areas.push({k:'영',v:eng});
  if((has.탐||useAll)&&tanVal!=null)areas.push({k:'탐',v:tanVal});
  if(areas.length<N)return 'unknown';
  const reqK=/국어?\s*포함/.test(seg),reqM=/수학?\s*포함/.test(seg)&&!/국\s*\/\s*수/.test(seg);
  const req=areas.filter(a=>(reqK&&a.k==='국')||(reqM&&a.k==='수'));
  const rest=areas.filter(a=>!req.includes(a)).map(a=>a.v).sort((a,b)=>a-b);
  if(req.length>N)return 'unknown';
  const need=N-req.length;
  if(rest.length<need)return 'unknown';
  const sum=req.reduce((a,b)=>a+b.v,0)+rest.slice(0,need).reduce((a,b)=>a+b,0);
  return sum<=M?'pass':'fail';
}

/* ================================================================
   SVG 차트 헬퍼 (등급축 역전: 1등급이 위)
================================================================ */
function svgChart(opt){
  const W=opt.w||520,H=opt.h||190,P={l:30,r:12,t:12,b:22};
  const xs=opt.labels.map((_,i)=>P.l+(W-P.l-P.r)*(opt.labels.length===1?0.5:i/(opt.labels.length-1)));
  let vals=[];
  opt.series.forEach(s=>s.pts.forEach(v=>{if(v!=null)vals.push(v);}));
  if(opt.band){vals.push(opt.band.lo,opt.band.hi);}
  if(opt.hline!=null)vals.push(opt.hline);
  if(!vals.length)return '<div class="muted">표시할 데이터 없음</div>';
  let lo=Math.min(...vals),hi=Math.max(...vals);
  const pad=Math.max((hi-lo)*0.15,0.3);lo-=pad;hi+=pad;
  lo=Math.max(0.5,lo);hi=Math.min(9.5,hi);
  const Y=v=>P.t+(H-P.t-P.b)*((v-lo)/(hi-lo));     // 등급↑=아래 / 역전: 작은등급 위
  const yRev=v=>P.t+(H-P.t-P.b)*(1-(hi-v)/(hi-lo));
  const yy=v=>P.t+(H-P.t-P.b)*((v-lo)/(hi-lo));
  let g='';
  // 그리드
  const step=(hi-lo)>3?1:0.5;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){
    const y=yy(v);
    g+=`<line x1="${P.l}" y1="${y}" x2="${W-P.r}" y2="${y}" stroke="#eef2f8"/><text x="${P.l-5}" y="${y+3.5}" font-size="9" fill="#94a3b8" text-anchor="end">${(Math.round(v*10)/10)}</text>`;
  }
  // 예측 밴드
  if(opt.band){
    const x0=xs[xs.length-1],x1=W-P.r;
    g+=`<rect x="${x0}" y="${yy(opt.band.lo)}" width="${Math.max(x1-x0,18)}" height="${yy(opt.band.hi)-yy(opt.band.lo)}" fill="#fde68a" opacity="0.4"/>`;
    g+=`<line x1="${x0}" y1="${yy(opt.band.center)}" x2="${x1}" y2="${yy(opt.band.center)}" stroke="#d97706" stroke-width="2" stroke-dasharray="4 3"/>`;
  }
  // 학생 수평선
  if(opt.hline!=null){
    g+=`<line x1="${P.l}" y1="${yy(opt.hline)}" x2="${W-P.r}" y2="${yy(opt.hline)}" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="6 3"/>`;
    g+=`<text x="${W-P.r-2}" y="${yy(opt.hline)-4}" font-size="9.5" fill="#dc2626" text-anchor="end" font-weight="700">${opt.hlineLabel||''}</text>`;
  }
  // 시리즈
  opt.series.forEach(s=>{
    let path='',started=false;
    s.pts.forEach((v,i)=>{if(v==null){return;}
      path+=(started?'L':'M')+xs[i].toFixed(1)+' '+yy(v).toFixed(1)+' ';started=true;});
    if(path)g+=`<path d="${path}" fill="none" stroke="${s.color}" stroke-width="${s.width||2}" ${s.dash?`stroke-dasharray="${s.dash}"`:''}/>`;
    s.pts.forEach((v,i)=>{if(v==null)return;
      g+=`<circle cx="${xs[i]}" cy="${yy(v)}" r="3" fill="${s.color}"><title>${s.label} ${opt.labels[i]}: ${v.toFixed?v.toFixed(2):v}</title></circle>`;});
  });
  // x 라벨
  opt.labels.forEach((l,i)=>{g+=`<text x="${xs[i]}" y="${H-6}" font-size="9.5" fill="#64748b" text-anchor="middle">${l}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W+60}px">${g}</svg>`;
}
function gradeBg(g){ // 1(좋음)→초록 ~ 9(나쁨)→빨강 파스텔

  const hue=120-110*t;
  return `background:hsl(${hue} 75% 88%);color:hsl(${hue} 65% 24%)`;

    .sort((a,b)=>a.ban-b.ban||a.no-b.no);

    const k=s.ban+'-'+s.no;
    return `<button class="stubtn ${UI.curStu===k?'on':''}" onclick="selectStu('${k}')">${s.ban}${String(s.no).padStart(2,'0')} ${s.name||''}</button>`;
  }).join(''):'<div class="muted">학생 데이터 없음 — 내신/모고 시트를 확인하세요</div>';
}

function renderStuDetail(){
  const el=document.getElementById('stuDetail');
  const stu=DATA.students[UI.curStu];
  if(!stu){el.innerHTML='';return;}
  let html='';
  /* --- 1. 내신 성적표 --- */
  html+=`<div class="card"><h2>📋 ${stu.name} (${stu.ban}반 ${stu.no}번) — 내신 성적표
    <button class="info-i" onclick="openGuide('formula')">i</button></h2>`;
  if(stu.mockOnly){html+='<div class="muted">내신 시트에 자료 없음 (모고만 존재)</div>';}
  else{
    html+='<div style="overflow-x:auto"><table class="grid"><tr><th>학년/학기</th><th>전과목</th><th>국영수탐</th><th>국어</th><th>수학</th><th>영어</th><th>탐구<br><span style="font-weight:400;font-size:10px">(최우선1과목)</span></th><th>진로선택(A/B/C)</th></tr>';
    SEM_ORDER.forEach(sk=>{
      const s=stu.sems[sk];
      html+=`<tr><td><b>${sk}</b></td>`;
      if(!s){html+='<td></td>'.repeat(7)+'</tr>';return;}
      [s.all,s.kmet,s.kor,s.math,s.eng,s.tan].forEach(v=>{
        html+=`<td><span class="gcell" style="${gradeBg(v)};display:block">${fmtG(v)}</span></td>`;});
      html+=`<td style="font-size:11px;text-align:left">${(s.career||[]).join(', ')}</td></tr>`;
    });
    const c=stu.cum||{};
    html+=`<tr style="border-top:2px solid var(--pri)"><td><b>누적</b></td>`;
    [c.all,c.kmet,c.kor,c.math,c.eng,c.tan].forEach(v=>{html+=`<td><span class="gcell" style="${gradeBg(v)};display:block">${fmtG(v)}</span></td>`;});
    html+='<td></td></tr></table></div>';
    /* 추세 배지 */
    const semPts=SEM_ORDER.map((sk,i)=>({x:i,y:stu.sems[sk]?.kmet})).filter(p=>p.y!=null);
    if(semPts.length>=3){
      const sl=theilSen(semPts);
      const b=sl<=-0.12?['b-up','▲ 상승 추세']:(sl>=0.12?['b-dn','▼ 하락 추세']:['b-flat','— 유지']);
      html+=`<div class="statline"><span class="badge ${b[0]}">${b[1]} (국영수탐 학기당 ${sl>0?'+':''}${sl.toFixed(2)}등급)</span>
        <button class="info-i" onclick="openGuide('theilsen')">i</button>
        <span class="small">Theil-Sen 추세 — 한 학기 이변에 둔감한 중앙값 기울기</span></div>`;
    }
    /* 3-1 시나리오 */
    if(!stu.sems['3-1']&&c.all!=null){
      const totC=Object.values(stu.sems).reduce((a,s)=>a+(s.creditsG||0),0);
      const est31=Math.round(totC/4);
      html+=`<div class="statline"><span class="small">📐 3-1 시나리오 (예상 ${est31}학점):</span>`;
      [c.all-1,c.all-0.5,c.all,c.all+0.5].forEach(g=>{
        if(g<1||g>9)return;
        const fin=(c.all*totC+g*est31)/(totC+est31);
        html+=`<span class="stat">3-1에 <b>${fmtG(g)}</b> → 최종 <b>${fmtG(fin)}</b></span>`;});
      html+=`</div>`;
    }
  }
  html+='</div>';
  /* --- 2. 추이 차트 --- */
  if(!stu.mockOnly){
    const labels=SEM_ORDER;
    html+=`<div class="row"><div class="col card"><h2>📈 내신 추이 <span class="sub">등급축 역전: 위가 좋음</span></h2>`;
    html+=svgChart({labels,series:[
      {label:'전과목',pts:labels.map(sk=>stu.sems[sk]?.all??null),color:'#1e3a5f',width:2.4},
      {label:'국영수탐',pts:labels.map(sk=>stu.sems[sk]?.kmet??null),color:'#2563eb',dash:'5 3'},
    ],hline:stu.cum?.all,hlineLabel:'누적 '+fmtG(stu.cum?.all)});
    html+=`<div class="legend"><span><span class="sw" style="background:#1e3a5f"></span>전과목</span><span><span class="sw" style="background:#2563eb"></span>국영수탐</span><span><span class="sw" style="background:#dc2626"></span>누적평균</span></div></div>`;
    html+=`<div class="col card"><h2>📚 과목별 추이</h2><div class="row">`;
    [['국어','kor','#0e7490'],['수학','math','#7c3aed'],['영어','eng','#0d9488'],['탐구','tan','#b45309']].forEach(([nm,f,col])=>{
      html+=`<div style="flex:1;min-width:130px"><div class="small" style="font-weight:700">${nm}</div>`+
        svgChart({w:200,h:90,labels,series:[{label:nm,pts:labels.map(sk=>stu.sems[sk]?.[f]??null),color:col}]})+`</div>`;});
    html+='</div></div></div>';
  }
  /* --- 3. 내신 × 모고 --- */
  const mock=stu.mock;
  if(mock){
    const months=MONTH_ORDER.filter(m=>mock.months[m]);
    const mockAvg=m=>{const x=mock.months[m];if(!x)return null;
      const t=[x.t1,x.t2].filter(v=>v!=null);const tb=t.length?Math.min(...t):null;
      const vs=[x.kor,x.math,x.eng,tb].filter(v=>v!=null);
      return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length:null;};
    const lastM=months[months.length-1];
    const mAvg=mockAvg(lastM);
    const gap=(stu.cum?.kmet!=null&&mAvg!=null)?stu.cum.kmet-mAvg:null;
    html+=`<div class="card"><h2>⚖️ 내신 × 모고 비교 <button class="info-i" onclick="openGuide('gap')">i</button></h2>`;
    html+=svgChart({labels:months,series:[
      {label:'모고 평균(국수영탐)',pts:months.map(mockAvg),color:'#7c3aed',width:2.4},
      {label:'내신 누적(국영수탐)',pts:months.map(()=>stu.cum?.kmet??null),color:'#2563eb',dash:'5 3'},
    ]});
    if(gap!=null){
      const dir=gap>0.6?'모고 우위':(gap<-0.6?'내신 우위':'균형');
      html+=`<div class="statline">
        <span class="stat">내신(국영수탐) <b>${fmtG(stu.cum.kmet)}</b></span>
        <span class="stat">최근 모고(${lastM}) <b>${fmtG(mAvg)}</b></span>
        <span class="stat">격차 <b>${gap>0?'+':''}${gap.toFixed(2)}</b> → <b>${dir}</b></span></div>`;
    }
    /* 모고 영역별 월 추이 */
    html+=`<div class="small" style="font-weight:700;margin-top:8px">모고 영역별 추이</div><div class="row">`;
    [['국어','kor','#0e7490'],['수학','math','#7c3aed'],['영어','eng','#0d9488'],['탐1','t1','#b45309'],['탐2','t2','#d97706']].forEach(([nm,f,col])=>{
      html+=`<div style="flex:1;min-width:120px"><div class="small">${nm}</div>`+
        svgChart({w:190,h:80,labels:months,series:[{label:nm,pts:months.map(m=>mock.months[m]?.[f]??null),color:col}]})+`</div>`;});
    html+='</div></div>';
  }
  /* --- 4. 희망 학과 포트폴리오 --- */
  html+=renderPortfolio(stu);
  el.innerHTML=html;
}

function renderPortfolio(stu){
  const wishes=wishesOf(stu);
  let html=`<div class="card"><h2>🎯 희망 학과 (${wishes.length}) <button class="info-i" onclick="openGuide('judge')">i</button>
    <span class="sub">판정: 합격자 분포 내 위치(percentile) 기반</span></h2>`;
  /* 추가 UI */
  html+=`<div class="searchwrap"><input class="search" id="wishSearch" placeholder="학과 추가: 대학·학과 검색 후 클릭" oninput="renderWishSearch('${stu.ban}-${stu.no}')"><div class="results" id="wishResults" style="flex-basis:100%"></div></div>`;
  if(!wishes.length){html+='<div class="muted">등록된 희망 학과가 없습니다. 위에서 검색해 추가하세요.</div></div>';return html;}
  const groups={'안정':[],'적정':[],'소신':[],'상향':[],'판정불가':[]};
  wishes.forEach(w=>{
    const um=IPX.byUM[w.univ+'|'+normD(w.major)];
    let series=null,tname=w.type||'';
    if(um){
      const tk=Object.keys(um.types).find(k=>!tname||[...um.types[k].names].some(n=>normT(n)===normT(tname)||normT(n).includes(normT(tname))||normT(tname).includes(normT(n))))||Object.keys(um.types)[0];
      if(tk){series=typeSeries(um.types[tk]);if(!tname)tname=[...um.types[tk].names].pop();}
    }
    const pred=series?predictCut(series):null;
    const pctE=series?percentileEst(series,stu.cum?.kmet):null;
    const bj=judgeBadge(pctE?.pct,pred?.vola);
    const grp=bj.label.startsWith('안정')?'안정':bj.label.startsWith('적정')?'적정':bj.label.startsWith('소신')?'소신':bj.label.startsWith('상향')?'상향':'판정불가';
    const minT=findMinT(w.univ,w.major,tname);
    let minHtml='';
    if(minT){
      const latest=minT.y26||minT.y25;
      let st='unknown';
      if(stu.mock){const months=MONTH_ORDER.filter(m=>stu.mock.months[m]);const lm=months[months.length-1];
        if(lm)st=checkMinReq(latest,stu.mock.months[lm]);}
      const stChip=st==='pass'?'<span class="badge b-safe">최저 충족</span>':st==='fail'?'<span class="badge b-high">최저 미충족</span>':st==='none'?'<span class="badge b-gray">최저 없음</span>':'<span class="badge b-warn">최저 확인</span>';
      minHtml=`<div class="small">${stChip} ${latest||''}</div>`;
    }
    groups[grp].push({w,tname,pred,pctE,bj,minHtml,um});
  });
  html+='<div class="portfolio">';
  [['안정','b-safe'],['적정','b-fit'],['소신','b-reach'],['상향','b-high'],['판정불가','b-gray']].forEach(([g,cls])=>{
    if(!groups[g].length)return;
    html+=`<div class="pcol"><h4><span class="badge ${cls}">${g}</span> ${groups[g].length}개</h4>`;
    groups[g].forEach(it=>{
      const reb=it.pred?.rebound?` <span class="badge b-warn" title="직전년 컷 급변 → 평균회귀 보정 적용">↩️</span>`:'';
      html+=`<div class="pitem" onclick="openMajorFromWish('${it.w.univ}','${it.w.major.replace(/'/g,"\\'")}')">
        <b>${it.w.univ}</b> ${it.w.major}<br><span class="small">${it.tname||''}</span>${reb}<br>
        ${it.pred?`<span class="small">예상컷 ${fmtG(it.pred.lo)}~${fmtG(it.pred.hi)} (중심 ${fmtG(it.pred.center)})</span><br>`:''}
        ${it.pctE?`<span class="small">분포 내 위치 상위 ~${Math.round(it.pctE.pct)}%</span><br>`:''}
        ${it.minHtml}
        <div style="margin-top:5px;display:flex;gap:5px">
          <button class="btn btn-sub" style="padding:3px 9px;font-size:11px" onclick="event.stopPropagation();openMemo('${stu.ban}-${stu.no}','${it.w.univ}','${it.w.major.replace(/'/g,"\\'")}','${(it.tname||'').replace(/'/g,"\\'")}')">💬 메모</button>
          <button class="btn btn-danger" style="padding:3px 9px;font-size:11px" onclick="event.stopPropagation();delWish('${stu.ban}-${stu.no}','${it.w.univ}','${it.w.major.replace(/'/g,"\\'")}')">삭제</button>
        </div></div>`;
    });
    html+='</div>';
  });
  html+='</div></div>';
  /* 메모 패널 */
  html+=`<div id="memoPanel"></div>`;
  return html;
}

async function submitMemo(stuKey,univ,major,tname){

  if(ok||UI.demo){if(UI.demo)DATA.counsel.push({ts:'(데모)',name:stu.name,ban:String(stu.ban),no:String(stu.no),univ,major,type:tname,kind:'memo',memo:txt});

function renderMajorSearch(){

  const box=document.getElementById('majorResults');if(!box)return;
  if(q.length<2){box.innerHTML='<div class="muted">두 글자 이상 입력하세요</div>';return;}

    const k=e.univ+'|'+normD(e.major);
    return `<div class="resitem" onclick="UI.curMajor='${k}';renderMajorDetail()"><b>${e.univ}</b> ${e.major}<span class="muted">${e.region} · 전형 ${Object.keys(e.types).length}개</span></div>`;

function renderMajorDetail(){
  const el=document.getElementById('majorDetail');
  const um=IPX.byUM[UI.curMajor];
  if(!um){el.innerHTML='';return;}
  const curStu=DATA.students[UI.curStu];
  let html=`<div class="card"><h2>🏫 ${um.univ} — ${um.major} <span class="sub">${um.region}</span>
    ${curStu?`<span class="badge b-fit">기준 학생: ${curStu.name} (국영수탐 ${fmtG(curStu.cum?.kmet)})</span>`:''}
    <button class="info-i" onclick="openGuide('predict')">i</button></h2>`;
  /* 희망 학생 */
  const wishers=wishersOf(um.univ,um.major);
  if(wishers.length){
    html+=`<div class="statline"><span class="small" style="font-weight:700">이 학과 희망 학생:</span>`+
      wishers.map(s=>`<button class="stubtn" onclick="selectStuAndGo('${s.ban}-${s.no}')">${s.ban}${String(s.no).padStart(2,'0')} ${s.name} <span class="muted">${fmtG(s.cum?.kmet)}</span></button>`).join('')+`</div>`;
  }
  html+='</div>';
  /* 전형별 카드 */
  const tks=Object.keys(um.types).sort((a,b)=>{
    const av=um.types[a],bv=um.types[b];
    const ay=Object.values(av.years).filter(y=>y.cut70!=null).length;
    const by=Object.values(bv.years).filter(y=>y.cut70!=null).length;
    return by-ay;});
  tks.forEach(tk=>{
    const t=um.types[tk];
    const names=[...t.names];
    const dispName=names[names.length-1];
    const series=typeSeries(t);
    const pred=predictCut(series);
    const years=[2022,2023,2024,2025,2026];
    html+=`<div class="major-card"><h3>[${t.cat}] ${dispName} ${names.length>1?`<span class="small">(표기: ${names.join(' / ')})</span>`:''}`;
    if(pred){
      html+=` <span class="badge ${pred.vola==='높음'?'b-warn':'b-gray'}">변동성 ${pred.vola} (σ ${pred.sigma.toFixed(2)})</span>`;
      if(pred.rebound)html+=` <span class="badge b-warn" title="직전년 ${pred.rebound.lastDelta>0?'하락(빵꾸)':'급상승'} ${Math.abs(pred.rebound.lastDelta).toFixed(2)}등급 → 평균회귀 보정 ${pred.rebound.adj>0?'+':''}${pred.rebound.adj.toFixed(2)}">↩️ 반동주의</span>`;
    }
    html+='</h3>';
    /* 표 */
    html+='<div style="overflow-x:auto"><table class="grid"><tr><th></th>'+years.map(y=>`<th>${y}</th>`).join('')+'<th style="background:#fef3c7">27예측</th></tr>';
    const rows=[['등급70','cut70'],['등급50','cut50'],['모집','mo'],['경쟁률','cr']];
    rows.forEach(([nm,f])=>{
      html+=`<tr><td><b>${nm}</b></td>`+series.map(s=>{
        const v=s[f];
        return `<td>${f.startsWith('cut')?`<span class="gcell" style="${gradeBg(v)};display:block">${fmtG(v)}</span>`:(v==null?'·':v)}</td>`;}).join('');
      html+=(f==='cut70'&&pred)?`<td style="background:#fffbeb"><b>${fmtG(pred.lo)}~${fmtG(pred.hi)}</b></td>`:'<td></td>';
      html+='</tr>';});
    html+='</table></div>';
    /* 차트 */
    const chartOpt={labels:years.map(String),series:[
      {label:'등급70',pts:series.map(s=>s.cut70),color:'#1e3a5f',width:2.4},
      {label:'등급50',pts:series.map(s=>s.cut50),color:'#94a3b8',dash:'4 3'},
    ]};
    if(pred)chartOpt.band=pred;
    if(curStu?.cum?.kmet!=null){chartOpt.hline=curStu.cum.kmet;chartOpt.hlineLabel=curStu.name+' '+fmtG(curStu.cum.kmet);}
    html+='<div class="svgwrap">'+svgChart(chartOpt)+'</div>';
    html+=`<div class="legend"><span><span class="sw" style="background:#1e3a5f"></span>등급70</span><span><span class="sw" style="background:#94a3b8"></span>등급50</span><span><span class="sw" style="background:#fde68a"></span>27 예측밴드</span>${curStu?'<span><span class="sw" style="background:#dc2626"></span>학생 내신</span>':''}</div>`;
    /* 학생 판정 */
    if(curStu?.cum?.kmet!=null&&pred){
      const pctE=percentileEst(series,curStu.cum.kmet);
      const bj=judgeBadge(pctE?.pct,pred.vola);
      html+=`<div class="statline"><span class="badge ${bj.cls}">${bj.label}</span>`;
      if(pctE)html+=`<span class="stat">합격자 분포 내 위치(추정) <b>상위 ~${Math.round(pctE.pct)}%</b></span>`;
      html+=`<span class="stat">여유 <b>${(pred.center-curStu.cum.kmet)>0?'+':''}${(pred.center-curStu.cum.kmet).toFixed(2)}</b>등급</span>
        <button class="info-i" onclick="openGuide('judge')">i</button></div>`;
    }
    /* 경쟁률 동반 설명 (사후) */
    for(let i=1;i<series.length;i++){
      const a=series[i-1],b=series[i];
      if(a.cut70!=null&&b.cut70!=null&&a.cr&&b.cr){
        const dCut=b.cut70-a.cut70,dCr=Math.log(b.cr/a.cr);
        if(Math.abs(dCut)>=0.5&&Math.abs(dCr)>=0.55&&dCut*dCr<0){
          html+=`<div class="small">ℹ️ ${b.year}년 컷 ${dCut<0?'상승':'하락'}(${Math.abs(dCut).toFixed(2)})은 경쟁률 ${dCr>0?'급등':'급락'}(${a.cr}→${b.cr}) 동반 — 전체 데이터 상관 −0.33</div>`;}
      }
    }
    /* 수능최저 4년 */
    const minT=findMinT(um.univ,um.major,dispName);
    if(minT){
      html+=`<div class="minrow"><b style="font-size:12px">수능최저</b>`;
      [['23',minT.y23],['24',minT.y24],['25',minT.y25],['26',minT.y26]].forEach(([y,v])=>{
        if(v)html+=`<span class="yr">${y}: <b>${v}</b></span>`;});
      if(minT.memo)html+=`<span class="yr" style="background:#fff7ed">📝 ${minT.memo}</span>`;
      html+='</div>';
      if(curStu?.mock){
        const months=MONTH_ORDER.filter(m=>curStu.mock.months[m]);
        const latest=minT.y26||minT.y25;
        if(latest&&months.length){
          html+=`<div class="minrow"><span class="small">충족 추이(${curStu.name}):</span><div class="monthchips">`;
          months.forEach(m=>{
            const r=checkMinReq(latest,curStu.mock.months[m]);
            html+=`<span class="mchip ${r==='pass'?'y':r==='fail'?'n':'u'}">${m} ${r==='pass'?'✓':r==='fail'?'✕':'?'}</span>`;});
          html+=`</div><button class="info-i" onclick="openGuide('minreq')">i</button></div>`;
        }
      }
    }else{
      html+=`<div class="small">수능최저: 최저타깃 시트에 미입력 (타깃 학과면 시트에 추가)</div>`;
    }
    html+='</div>';
  });
  el.innerHTML=html;
}

<h3 id="g-theilsen">2. 추세(Theil-Sen 기울기)</h3>
<p><b>무엇:</b> 내신 학기별·모고 월별 변화의 방향과 속도를 숫자 하나(학기당/월당 등급 변화)로 요약합니다.</p>
<p><b>어떻게:</b> 모든 두 시점 쌍의 기울기를 구해 <b>중앙값</b>을 취합니다(Theil-Sen 추정량). 보통의 최소제곱(OLS) 회귀와 달리 한 번의 이상 성적(아픈 날 시험 등)에 거의 영향을 받지 않아, 5~9개 점밖에 없는 학생 데이터에 적합합니다.</p>
<p><b>해석:</b> 국영수탐 기준 학기당 −0.12 이하면 ▲상승(성적 향상), +0.12 이상이면 ▼하락으로 표시합니다. 학생부종합전형에서 '상승 곡선'은 실제 평가 요소로 언급되는 만큼 상담 근거로 쓸 수 있습니다.</p>
<div class="warn">주의: 점이 3개 미만이면 추세를 계산하지 않습니다. 추세는 과거 요약이지 미래 보장이 아닙니다.</div>

<h3 id="g-predict">3. 27학년도 예상컷 밴드 · 변동성 등급</h3>
<p><b>무엇:</b> 학과·전형의 다음 해 등급70 컷을 <b>점이 아닌 범위</b>로 제시합니다.</p>
<p><b>어떻게:</b></p>
<ul>
<li>중심값 = 최근 연도에 가중치를 더 둔 5년 가중평균 (최신 반영, 1회성 이변 완충)</li>
<li>밴드 폭 = 그 학과 5년 컷의 표준편차 σ (최소 ±0.2등급)</li>
<li>변동성 등급: σ&lt;0.15 낮음 / ~0.40 보통 / &gt;0.40 높음 — 전체 8,933개 학과의 σ 중앙값 0.24, 75분위 0.40을 기준으로 구간화</li>
</ul>
<div class="ev">왜 범위인가: 같은 "컷과 0.3등급 차이"라도 σ=0.1인 학과는 사실상 확정, σ=0.5인 학과는 도박입니다. 점 추정은 이 차이를 숨깁니다.</div>
<div class="warn">주의: 전형 개편(통합·신설·모집인원 급변)이 있으면 과거 추이의 의미가 약해집니다. ⚠️·메모를 함께 확인하세요.</div>

<h3 id="g-rebound">4. 격년 반동(평균회귀) 보정 ↩️</h3>
<p><b>무엇:</b> 직전 해에 컷이 급변(±0.5등급 이상)한 학과는 다음 해에 일부 되돌아오는 경향을 예측에 반영합니다.</p>
<div class="ev">근거(이 데이터 자체로 검증): 연속 3개년 데이터가 있는 12,995개 사례에서 연속 변화량의 상관 = <b>−0.38</b>.<br>
· 컷이 0.5등급 이상 <b>급상승(빡세짐)</b>한 학과 → 다음 해 평균 <b>+0.26등급 완화</b> (1,682사례)<br>
· 컷이 0.5등급 이상 <b>하락(빵꾸)</b>한 학과 → 다음 해 평균 <b>−0.44등급 회복</b> (1,832사례)</div>
<p><b>적용:</b> 직전년 변화량 × (−0.38)을 예측 중심값에 더하고 ↩️ 배지로 표시합니다.</p>
<p><b>상담 포인트:</b> "작년에 빵꾸 난 학과"는 그 사실이 알려져 지원이 몰리며 평균 0.4등급 이상 회복됩니다. 작년 컷만 보고 지원선을 잡는 것은 위험합니다.</p>
<div class="warn">함께 기각된 통념: "전년 경쟁률이 오른 학과는 다음 해 컷이 변한다"는 가설은 같은 데이터(14,098사례)에서 상관 0.004로 <b>예측력이 없어</b> 이 도구에 넣지 않았습니다.</div>

<h3 id="g-judge">5. 합격자 분포 내 위치(percentile)와 판정 배지</h3>
<p><b>무엇:</b> "컷과 몇 등급 차이"보다 정보가 많은, <b>합격자 분포에서 학생이 어디쯤인지</b>를 추정합니다.</p>
<p><b>어떻게:</b> 등급50(중앙값)과 등급70(상위 70% 지점)은 합격자 분포의 두 분위점입니다. 정규분포 근사로:</p>
<div class="formula">μ = 등급50, σ = (등급70 − 등급50) ÷ 0.524<br>학생 위치(percentile) = Φ((학생 내신 − μ) ÷ σ)</div>
<div class="ev">타당성: 전체 47,128개 사례에서 등급70−등급50 차이의 중앙값은 0.20등급(IQR 0.09~0.39)으로, 정규근사가 무리 없는 범위입니다. 등급50이 없는 경우 전체 중앙값 기반 σ=0.38을 대신 사용합니다(추정 정확도 낮아짐).</div>
<p><b>판정 기준:</b> 분포 내 위치 40% 미만 = <span class="badge b-safe">안정</span>, 40~75% = <span class="badge b-fit">적정</span>, 75~92% = <span class="badge b-reach">소신</span>, 92% 이상 = <span class="badge b-high">상향</span>. 변동성 '높음' 학과는 배지에 '변동큼'을 덧붙입니다.</p>
<div class="warn">한계: ① 최종등록자 기준 공개값이라 추가합격 막차는 더 낮을 수 있음 ② 정규분포는 근사일 뿐(소수 모집 학과는 오차 큼) ③ 대학별 반영교과 차이 미반영. <b>배지는 출발점이지 결론이 아닙니다.</b></p>

<h3 id="g-gap">6. 내신 × 모고 격차</h3>
<p><b>무엇:</b> 내신 누적(국영수탐)과 최근 모의고사 평균(국·수·영·탐구best)을 같은 등급 축에서 비교합니다.</p>
<p><b>해석 가이드(±0.6등급 기준):</b></p>
<ul>
<li><b>내신 우위</b>(내신이 0.6+ 좋음): 교과전형 중심. 수능최저가 있는 전형은 충족 추이를 반드시 확인.</li>
<li><b>모고 우위</b>(모고가 0.6+ 좋음): 최저 기준이 높은 교과·논술 전형에서 상대적 이점(최저 미충족 경쟁자의 이탈 효과). 정시 지원선도 병행 검토.</li>
<li><b>균형</b>: 두 전략 모두 열려 있음.</li>
</ul>
<div class="warn">내신 등급과 모고 등급은 모집단이 달라(학교 내 상대평가 vs 전국) 직접 비교는 '방향 판단'까지만 유효합니다.</div>

<h3 id="g-minreq">7. 수능최저 충족 판정</h3>
<p><b>무엇:</b> 최저타깃 시트에 적은 기준 텍스트(예: "국·수·영·탐(1) 중 3개 합 7")를 해석해 학생의 모의고사 월별 충족 여부를 표시합니다.</p>
<p><b>인식 규칙:</b> "N개 합 M" 패턴, 한국사 제한, 탐구 1과목/2과목 평균, 과탐/사탐 한정, "수학 포함" 류 필수 지정. 해석 불가한 문구는 ?로 표시하고 원문을 그대로 보여줍니다.</p>
<p><b>충족 추이를 보는 이유:</b> 한 번의 충족보다 "몇 월부터 안정적으로 충족하는가"가 실제 리스크 판단 기준입니다. 6월·9월 평가원 모고의 충족 여부에 가중을 두고 보세요.</p>
<div class="warn">한계: 영어 환산 특례, 절사 규정 등 세칙은 단순화되어 있습니다. 최종 지원 전 반드시 모집요강 원문을 확인하세요. 최저는 어디까지나 <b>보조 지표</b>입니다.</div>

<h3>8. 데이터 출처·동기화</h3>
<p>학과 입결(5년)·수능최저(타깃 학과 직접 입력)·내신(나이스 원본을 반별 시트에 붙여넣기)·모고·상담메모 전부 선생님의 구글시트에서 실시간으로 읽습니다. <b>시트를 수정하면 🔄 새로고침 시 즉시 반영</b>되며, 이 HTML 파일에는 어떤 학생 정보도 저장되지 않습니다.</p>`;

  if(anchor){setTimeout(()=>{const el=document.getElementById('g-'+anchor);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},60);}
}
